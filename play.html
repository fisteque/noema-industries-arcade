<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1522">
<meta name="description" content="Noema Industries Arcade — herní režim s ručním měřítkem a celou obrazovkou.">
<title>Hrát · Noema Industries Arcade</title>
<style>
:root{color-scheme:dark;--bg:#0d1522;--text:#f0f5f4;--muted:#bdc9d3;--line:#304154;--gold:#efce78;--mint:#91d4bf}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0;background:radial-gradient(ellipse at 15% 0%,#26384b,transparent 55%),var(--bg)}
.toolbar{display:flex;flex:none;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line);background:#121f2ebe;backdrop-filter:blur(10px);min-height:58px}
.back{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--gold);text-decoration:none;font-weight:800}
.back:hover{text-decoration:underline}
.game-info{display:flex;flex:1;flex-direction:column;justify-content:center;min-width:0}
.game-info strong{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-info small{color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.controls button,.controls a{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:35px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:#18293a;color:var(--text);white-space:nowrap;text-decoration:none;cursor:pointer}
.controls button:hover,.controls a:hover{border-color:var(--mint);background:#25384a}
.controls button[aria-pressed="true"]{background:#e1f0e7;color:#11232b;border-color:#e1f0e7;font-weight:800}
.zoom-controls{display:inline-flex;align-items:center;gap:3px;flex:none;padding:4px;border:1px solid #b1c5d055;border-radius:999px;background:#091827a8;backdrop-filter:blur(9px)}
.zoom-controls button{min-width:38px;min-height:36px;padding:4px 9px;border:0;border-radius:999px;background:transparent;color:var(--text);font-weight:800;font-size:1.14rem}
.zoom-controls button:hover{border-color:transparent;background:#ffffff26}
.zoom-controls button:disabled{opacity:.35;cursor:not-allowed;background:transparent}
.zoom-controls #zoom-reset{min-width:66px;font-size:.88rem;font-variant-numeric:tabular-nums}
#stage{display:flex;flex:1;min-height:0;min-width:0;align-items:safe center;justify-content:safe center;overflow:auto;position:relative;overscroll-behavior:contain;padding:10px;background:radial-gradient(ellipse at center,#263549 0%,#111b2c 78%)}
.canvas{position:relative;flex:none;margin:auto;width:100%;height:100%;background:#111c2b;box-shadow:0 5px 32px #0007;overflow:visible}
#game-frame{display:block;position:absolute;inset:0;width:100%;height:100%;border:0;background:#0c1526;transform-origin:top left}
.notice{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);max-width:min(560px,calc(100% - 28px));padding:18px 24px;border:1px solid var(--line);border-radius:14px;background:#18283b;color:var(--text);box-shadow:0 10px 30px #0008;text-align:center}
.notice[hidden]{display:none}
.notice a{color:var(--gold)}
.status-bar{display:flex;justify-content:space-between;gap:12px;flex:none;padding:5px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:.76rem;min-height:26px}
.status-bar span:last-child{text-align:right}
#app:fullscreen{width:100%;height:100%;height:100dvh}
@media(max-width:800px){
  .toolbar{gap:8px;padding:8px 10px;flex-wrap:wrap}
  .game-info{flex:1 1 0;min-width:0}
  /* One mobile row: zoom, fullscreen icon, original-game icon. */
  .controls{width:100%;justify-content:center;gap:8px;flex-wrap:nowrap}
  .controls .control-label{display:none}
  .controls .zoom-controls{flex:0 0 auto}
  .controls .zoom-controls button{flex:0 0 auto;min-width:42px;min-height:42px;padding:4px 7px}
  .controls .zoom-controls #zoom-reset{min-width:64px}
  .controls>button,.controls>a{flex:0 0 44px;width:44px;min-width:44px;min-height:44px;padding:7px;font-size:1.2rem}
  .status-bar span:last-child{display:none}
}
@media(max-width:460px){
  .controls{gap:5px}
  .controls .zoom-controls{gap:0;padding:2px}
  .controls .zoom-controls button{min-width:40px;min-height:40px;padding:4px 5px}
  .controls .zoom-controls #zoom-reset{min-width:60px}
  .controls>button,.controls>a{flex-basis:42px;width:42px;min-width:42px;min-height:42px}
  #stage{padding:6px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header class="toolbar">
<a class="back" href="./" aria-label="Zpět do herny">← 🦆 Herna</a>
<div class="game-info"><strong id="game-title">Načítám hru…</strong><small id="game-credit">Noema Industries Arcade</small></div>
<nav class="controls" aria-label="Nastavení zobrazení">
<div class="zoom-controls" role="group" aria-label="Ruční měřítko hry">
<button type="button" id="zoom-out" title="Zmenšit měřítko o 10 %" aria-label="Zmenšit měřítko o 10 %">−</button>
<button type="button" id="zoom-reset" title="Vrátit měřítko na 100 %" aria-label="Vrátit měřítko na 100 %">100 %</button>
<button type="button" id="zoom-in" title="Zvětšit měřítko o 10 %" aria-label="Zvětšit měřítko o 10 %">+</button>
</div>
<button type="button" id="fullscreen-button" aria-pressed="false" aria-label="Celá obrazovka" title="Rozšířit na celou obrazovku"><span id="fullscreen-icon" aria-hidden="true">⛶</span><span class="control-label">Celá obrazovka</span></button>
<a id="original-link" href="./" target="_blank" rel="noopener noreferrer" aria-label="Otevřít původní hru bez herního režimu" title="Otevřít původní hru bez herního režimu"><span class="control-label">Původní</span><span aria-hidden="true">↗</span></a>
</nav>
</header>
<main id="stage" aria-label="Herní obrazovka" aria-busy="true">
<div id="canvas" class="canvas"><iframe id="game-frame" title="Hra Noema Industries" allowfullscreen></iframe></div>
<div id="notice" class="notice" role="status">Načítám hru…</div>
</main>
<footer class="status-bar"><span id="scale-status" aria-live="polite">Měřítko: 100 % · + / − mění velikost</span><span>Hra se může posouvat · Esc ukončí celou obrazovku</span></footer>
</div>
<script>
(() => {
  "use strict";
  const $=id=>document.getElementById(id);
  const app=$("app"),stage=$("stage"),canvas=$("canvas"),frame=$("game-frame"),notice=$("notice");
  const outButton=$("zoom-out"),resetButton=$("zoom-reset"),inButton=$("zoom-in");
  const fullscreenButton=$("fullscreen-button"),status=$("scale-status"),original=$("original-link");
  const MIN_ZOOM=50,MAX_ZOOM=150,ZOOM_STEP=10;
  let zoom=100,loaded=false,queued=false;

  function fail(message) {
    notice.hidden=false;
    notice.textContent=message+" ";
    const link=document.createElement("a");
    link.href="./";link.textContent="Zpět do herny";
    notice.append(link);
    frame.hidden=true;
    stage.setAttribute("aria-busy","false");
    status.textContent="Hru se nepodařilo otevřít.";
  }
  function queueLayout(){
    if(queued||!loaded)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;layout();});
  }
  function stageSize(){
    // Bounds are stable even when the stage gains scrollbars at zoom > 100 %.
    const bounds=stage.getBoundingClientRect(),style=getComputedStyle(stage);
    const pad=(side)=>parseFloat(style.getPropertyValue("padding-"+side))||0;
    return {w:Math.max(1,Math.floor(bounds.width-pad("left")-pad("right")-2)),
            h:Math.max(1,Math.floor(bounds.height-pad("top")-pad("bottom")-2))};
  }
  function layout(){
    if(!loaded)return;
    const avail=stageSize();
    // Zooming out must reveal more of the game, not shrink the same cropped viewport.
    // Keep the on-screen height stable and grow the iframe's inner viewport as zoom decreases.
    // Do not use scrollHeight here: transient dialogs can otherwise leave a stale oversized frame.
    const width=Math.max(320,avail.w);
    const scale=zoom/100;
    const height=Math.max(420,Math.ceil(avail.h/scale));
    frame.style.width=width+"px";
    frame.style.height=height+"px";
    frame.style.transform="scale("+scale+")";
    canvas.style.width=Math.ceil(width*scale)+"px";
    canvas.style.height=Math.ceil(height*scale)+"px";
    resetButton.textContent=zoom+" %";
    outButton.disabled=zoom<=MIN_ZOOM;
    inButton.disabled=zoom>=MAX_ZOOM;
    status.textContent="Měřítko: "+zoom+" % · + / − mění velikost";
  }
  function setZoom(next){
    zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,next));
    resetButton.textContent=zoom+" %";
    outButton.disabled=zoom<=MIN_ZOOM;
    inButton.disabled=zoom>=MAX_ZOOM;
    queueLayout();
    if(loaded)frame.focus();
  }
  outButton.addEventListener("click",()=>setZoom(zoom-ZOOM_STEP));
  resetButton.addEventListener("click",()=>setZoom(100));
  inButton.addEventListener("click",()=>setZoom(zoom+ZOOM_STEP));
  fullscreenButton.addEventListener("click",()=>{
    const action=document.fullscreenElement?document.exitFullscreen():app.requestFullscreen();
    Promise.resolve(action).catch(()=>{status.textContent="Celou obrazovku prohlížeč nepovolil.";});
  });
  document.addEventListener("fullscreenchange",()=>{
    const active=!!document.fullscreenElement;
    fullscreenButton.setAttribute("aria-pressed",String(active));
    $("fullscreen-icon").textContent=active?"⤢":"⛶";
    const label=active?"Ukončit celou obrazovku":"Celá obrazovka";
    fullscreenButton.querySelector(".control-label").textContent=label;
    fullscreenButton.setAttribute("aria-label",label);
    fullscreenButton.title=label;
    queueLayout();
  });
  window.addEventListener("resize",queueLayout);
  if("ResizeObserver" in window)new ResizeObserver(queueLayout).observe(stage);
  frame.addEventListener("load",()=>{
    loaded=true;
    notice.hidden=true;
    stage.setAttribute("aria-busy","false");
    queueLayout();
  });

  (async()=>{
    try{
      const params=new URLSearchParams(location.search);
      const id=params.get("game"),requested=params.get("version");
      if(!id||!/^[a-z0-9-]+$/.test(id))throw Error("Není vybraná platná hra.");
      const response=await fetch("./catalog.json",{cache:"no-store"});
      if(!response.ok)throw Error("Nepodařilo se načíst katalog.");
      const catalog=await response.json();
      const game=Array.isArray(catalog.games)&&catalog.games.find(entry=>entry.id===id);
      if(!game||!Array.isArray(game.versions)||!game.versions.length)throw Error("Hra není v katalogu.");
      const version=requested?game.versions.find(entry=>entry.version===requested):game.versions[game.versions.length-1];
      if(!version)throw Error("Požadovaná verze hry neexistuje.");
      // Only explicit, local, versioned game paths can be embedded.
      const path=version.play;
      if(typeof path!=="string"||!/^games\/[a-z0-9-]+\/hra-[0-9]{2}\/v[0-9]+\/index\.html$/.test(path))throw Error("Cesta ke hře není platná.");
      const url=new URL("./"+path,location.href);
      const root=new URL("./",location.href);
      if(url.origin!==location.origin||!url.pathname.startsWith(root.pathname+"games/"))throw Error("Hra musí patřit do herny.");
      $("game-title").textContent=game.title;
      $("game-credit").textContent=game.author+" · "+version.version;
      document.title=game.title+" · Noema Industries Arcade";
      original.href=url.href;
      frame.title=game.title+" — "+version.version;
      frame.src=url.href;
    }catch(error){fail(error.message||"Nepodařilo se hru načíst.");}
  })();
})();
</script>
</body>
</html>
